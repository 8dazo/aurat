<text x="60" y="120" fill="#94A3B8" font-family="Arial,sans-serif" font-size="20">Verify meaningful behavior instead of brittle token-for-token output</text>
<rect x="60" y="170" width="1080" height="390" rx="24" fill="#111827" stroke="#334155"/>
