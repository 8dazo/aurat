<text x="130" y="347" fill="#93C5FD" font-family="Arial,sans-serif" font-size="19">✓ streaming mode</text>
<text x="130" y="384" fill="#93C5FD" font-family="Arial,sans-serif" font-size="19">✓ response kind</text>
