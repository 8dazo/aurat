<text x="600" y="260" text-anchor="middle" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="27" font-weight="700">Structured output</text>
<text x="480" y="310" fill="#86EFAC" font-family="Arial,sans-serif" font-size="19">✓ JSON key shape</text>
<text x="480" y="347" fill="#86EFAC" font-family="Arial,sans-serif" font-size="19">✓ missing scenarios</text>
<text x="480" y="384" fill="#86EFAC" font-family="Arial,sans-serif" font-size="19">✓ unexpected scenarios</text>
<text x="480" y="421" fill="#86EFAC" font-family="Arial,sans-serif" font-size="19">✓ deterministic diff</text>
<text x="480" y="458" fill="#86EFAC" font-family="Arial,sans-serif" font-size="19">✓ CI exit code</text>
<rect x="800" y="215" width="290" height="285" rx="20" fill="#0F172A" stroke="#334155"/>
