name: workspace UI
on:
  push:
    branches: [main]
    paths: ['apps/platform/**', 'apps/vercel-platform/**', 'services/vercel-gateway/**', 'scripts/verify-workspace-ui.mjs', '.github/workflows/workspace-ui.yml']
  pull_request:
    paths: ['apps/platform/**', 'apps/vercel-platform/**', 'services/vercel-gateway/**', 'scripts/verify-workspace-ui.mjs', '.github/workflows/workspace-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/vercel-platform/package.json
      - run: npm ci --ignore-scripts
      - run: node --test services/vercel-gateway/*.test.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: apps/vercel-platform
      - run: npm run build
        working-directory: apps/vercel-platform
      - run: npm install --prefix "$RUNNER_TEMP/aurat-browser" --no-package-lock --ignore-scripts playwright@1.62.1
      - run: node "$RUNNER_TEMP/aurat-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/verify-workspace-ui.mjs
        env:
          AURAT_PLAYWRIGHT_DIR: ${{ runner.temp }}/aurat-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ui-screenshots
          path: .aurat/ui-verification
          include-hidden-files: true
