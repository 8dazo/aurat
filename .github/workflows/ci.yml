name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run demo
      - uses: ./
        if: matrix.node == 22
        with:
          suite: examples/ticket-agent/suite.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurat-report-node-${{ matrix.node }}
          path: .aurat/report.json
          include-hidden-files: true
