name: Aurat Application Regression Gate
description: Execute changed Node application code against model and tool fixtures.
author: Aurat.ai
branding:
  icon: shield
  color: purple
inputs:
  suite:
    description: Scenario manifest in the caller repository.
    default: .aurat/suite.json
  report:
    description: JSON report path in the caller repository.
    default: .aurat/report.json
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install Aurat dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
    - name: Run application scenarios
      shell: bash
      env:
        AURAT_SUITE: ${{ inputs.suite }}
        AURAT_REPORT: ${{ inputs.report }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/src/cli.js" test --suite "$AURAT_SUITE" --report "$AURAT_REPORT"
        status=$?
        set -e
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          printf '### Aurat application regression\n\nExit code: %s. See step logs and the JSON report for scenario evidence.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
